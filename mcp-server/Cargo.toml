[package]
name = "mindat-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "MCP server for accessing the Mindat mineralogical database"
license = "MIT"

[[bin]]
name = "mindat-mcp"
path = "src/main.rs"

[dependencies]
mindat-rs = { path = ".." }
rmcp = { version = "0.14", features = ["server", "transport-io", "macros"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
